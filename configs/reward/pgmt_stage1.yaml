# Rates; Isaac RewardManager alone integrates them over dt.
groups: [upper, lower, auxiliary]
recovery_upward_velocity: false
weights:
  upper_body_position: 1.0
  upper_body_orientation: 1.0
  upper_body_linear_velocity: 0.5
  upper_body_angular_velocity: 0.5
  upper_joint_position: 1.0
  upper_joint_velocity: 0.5
  lower_body_position: 0.5
  lower_body_orientation: 2.0
  lower_body_linear_velocity: 0.5
  lower_body_angular_velocity: 0.5
  lower_joint_position: 0.5
  lower_joint_velocity: 0.5
  auxiliary_root_orientation: 0.5
  auxiliary_root_velocity: 2.0
  auxiliary_anchor_position: 1.0
  auxiliary_base_acceleration: -0.001
  auxiliary_end_effector_acceleration: -0.001
  auxiliary_action_rate: -0.05
  auxiliary_joint_limit: -15.0
  auxiliary_undesired_contacts: -0.1
  auxiliary_anchor_contact_force: -0.00001
tracking:
  body_position_sigma: 0.15
  body_orientation_sigma: 0.4
  body_linear_velocity_sigma: 1.0
  body_angular_velocity_sigma: 3.14
  joint_position_sigma: 0.4
  joint_velocity_sigma: 5.0
  root_orientation_sigma: 0.4
  root_velocity_sigma: 1.0
  anchor_position_sigma: 0.5
  anchor_deadzone: 0.3
  position_gain: 0.5
  correction_cap: 0.5
  speed_gate_saturation: 0.5
