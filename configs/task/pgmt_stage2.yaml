# P2 perception_only: the original three reward groups; terrain rewards are P3.
defaults:
  - robot: g1
  - terrain: pgmt_stage2_v8
  - motion: pgmt_emd
  - scene: none
  - sensor: pgmt_height_scan
  - obs: pgmt_stage2
  - reward: pgmt_stage1
  - network: pgmt_perception
  - algorithm: ppo
  - stage: scratch
experiment_name: pgmt_stage2_perception
motion:
  motion_files: ${oc.env:PMT_PGMT_MOTION_ROOT,${oc.env:PMT_REPO_ROOT,.}/assets/motions/pgmt_clipped_50hz_tcrs_v1}
  chunk_length: 0
  enable_frame_sampling: false
  fixed_start_frame: -1
  placement_xy_mode: center
terrain_asset: ${oc.env:PMT_REPO_ROOT,.}/assets/terrain/pgmt_stage2_v8
algorithm:
  learning_rate: 1.0e-4
# P3 reward deadzones; opt in without changing the original P2 baseline.
# Semantic families, independent of v5/v6 column order. Metres / radians.
tracking_relaxation:
  enabled: false
  position_max: 0.20
  orientation_max: 0.70
  joint_max: 0.50
  terrain_families: [stairs, slope, boxes]
  level_max: 9
  alpha:
    lower_body_position: {}
    lower_body_orientation: {}
    lower_joint_position: {}
